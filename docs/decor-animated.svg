<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Perfume Decant Shop animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="0.55" stop-color="#FDF1E7"/>
      <stop offset="1" stop-color="#F9E4D8"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7C9D4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F7C9D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9B8E8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C9B8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFDDF2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#BFDDF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9B8C6"/>
      <stop offset="0.5" stop-color="#FBD9E1"/>
      <stop offset="1" stop-color="#F5A9BC"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C87E"/>
      <stop offset="0.5" stop-color="#C49A5B"/>
      <stop offset="1" stop-color="#A87F3F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bottleClip">
      <rect x="545" y="86" width="110" height="150" rx="28"/>
    </clipPath>
    <style>
      .blob-a { animation: driftA 11s ease-in-out infinite; }
      .blob-b { animation: driftB 14s ease-in-out infinite; }
      .blob-c { animation: driftC 9s ease-in-out infinite; }
      .bottle { animation: floaty 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .shinebar { animation: sweep 4.2s ease-in-out infinite; }
      .spark { animation: rise 3.6s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: 0.7s; } .s3 { animation-delay: 1.3s; }
      .s4 { animation-delay: 1.9s; } .s5 { animation-delay: 2.5s; } .s6 { animation-delay: 3s; }
      .glowpulse { animation: glowp 5s ease-in-out infinite; }
      .title-shimmer { animation: tshimmer 6s linear infinite; }
      @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,24px); } }
      @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-20px); } }
      @keyframes driftC { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-30px); } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes sweep { 0% { transform: translateX(-90px) skewX(-18deg); } 55%,100% { transform: translateX(150px) skewX(-18deg); } }
      @keyframes rise {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: translateY(-110px) scale(1.1); opacity: 0; }
      }
      @keyframes glowp { 0%,100% { opacity: 0.35; } 50% { opacity: 0.7; } }
      @keyframes tshimmer { 0% { stop-color: #8A6B4A; } 50% { stop-color: #C49A5B; } 100% { stop-color: #8A6B4A; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" rx="24"/>

  <circle class="blob-a" cx="220" cy="160" r="150" fill="url(#blobA)"/>
  <circle class="blob-b" cx="980" cy="150" r="170" fill="url(#blobB)"/>
  <circle class="blob-c" cx="600" cy="260" r="140" fill="url(#blobC)"/>

  <ellipse class="glowpulse" cx="600" cy="252" rx="150" ry="26" fill="#E9B872" opacity="0.4"/>

  <!-- sparkles -->
  <g fill="#D9A441">
    <path class="spark s1" transform="translate(470,220)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark s2" transform="translate(735,225) scale(0.8)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark s3" transform="translate(520,235) scale(0.6)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark s4" transform="translate(690,230) scale(0.7)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark s5" transform="translate(600,215) scale(1.1)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark s6" transform="translate(430,210) scale(0.5)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
  </g>

  <!-- bottle -->
  <g class="bottle">
    <rect x="583" y="34" width="34" height="30" rx="6" fill="url(#gold)"/>
    <rect x="583" y="34" width="34" height="30" rx="6" fill="none" stroke="#8A6B35" stroke-width="1.5" opacity="0.5"/>
    <rect x="591" y="64" width="18" height="24" fill="url(#gold)" opacity="0.9"/>
    <rect x="545" y="86" width="110" height="150" rx="28" fill="url(#glass)"/>
    <rect x="545" y="86" width="110" height="150" rx="28" fill="none" stroke="#E08CA0" stroke-width="2" opacity="0.6"/>
    <g clip-path="url(#bottleClip)">
      <rect class="shinebar" x="560" y="60" width="44" height="220" fill="url(#shine)"/>
      <ellipse cx="585" cy="130" rx="14" ry="60" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <rect x="572" y="150" width="56" height="40" rx="6" fill="#FFFDF8" opacity="0.92"/>
    <rect x="572" y="150" width="56" height="40" rx="6" fill="none" stroke="#C49A5B" stroke-width="1.5"/>
    <text x="600" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#8A6B4A">DECANT</text>
    <text x="600" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="1" fill="#A98F68">5 ml · 10 ml</text>
  </g>

  <!-- titles -->
  <text x="600" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="#8A6B4A">PERFUME DECANT SHOP</text>
</svg>
