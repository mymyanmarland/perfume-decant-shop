<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Perfume Decant Shop</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shopper.css">
</head>
<body>
<div id="siteHeader"></div>
<main class="lx-wrap">
  <h1 class="lx-title" data-i18n="account.title">My Account</h1>
  <div class="lx-tabs" id="acct-tabs" role="tablist">
    <button class="lx-tab sel" data-tab="profile" data-i18n="account.profile">Profile</button>
    <button class="lx-tab" data-tab="addresses" data-i18n="account.addresses">Addresses</button>
    <button class="lx-tab" data-tab="favorites" data-i18n="account.favorites">Favorites</button>
    <button class="lx-tab" data-tab="reviews" data-i18n="account.reviews">My Reviews</button>
  </div>
  <div id="acct-root"><div class="lx-loading" data-i18n="common.loading">Loading…</div></div>
</main>
<div id="siteFooter"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/shopper.js"></script>
<script src="/js/shopper-i18n.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
